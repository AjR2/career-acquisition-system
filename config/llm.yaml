# Model pricing (USD per 1M tokens) used for spend tracking. Source: Anthropic pricing, cached 2026-10-06.
pricing:
  claude-haiku-5-5:  { input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125 }
  claude-sonnet-5-5: { input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50 }
  claude-opus-5-5:   { input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00 }

drafting:
  max_per_day: 4            # attention budget: ~15 min/day of approvals
  max_queue: 8              # stop drafting while this many drafts are waiting for review
  min_suitability: 0.70     # postings below this are never drafted (calibrated 2026-10-22: 0.55 let 80% through)
  cover_letter: when_requested   # only when the application form asks for one (spec: "when appropriate")

suitability:
  weights:
    technical_alignment: 0.30
    ai_native_culture: 0.25
    compensation: 0.20
    experience_alignment: 0.15
    career_development: 0.10
